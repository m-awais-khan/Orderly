<body>
  <div id="root"></div>
  <script>
    (function () {
      const savedMode = localStorage.getItem("watchlists-darkmode");
      const isDark = savedMode && JSON.parse(savedMode);

      // If dark mode is saved, apply the class immediately to the HTML tag
      if (isDark) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
